   s.horses.push(s.map);completeStory(s,n);log(s,'horse_obtain',{map:s.map});return {ok:true,horse:true,message:`${z.horse}已收入手册 · 可自行回广场安装`};
  }

function icon(name,cls=''){return `<svg class="art ${cls}" viewBox="0 0 100 100" aria-hidden="true">${p[name]||p.gift}</svg>`;}
function carousel(installed=0){return `<svg viewBox="0 0 400 320" class="carousel-art" aria-hidden="true"><ellipse cx="200" cy="280" rx="166" ry="30" fill="#496c68" opacity=".16"/><path d="M55 256q145-48 290 0v19q-145 61-290 0Z" fill="#b99476"/><ellipse cx="200" cy="256" rx="145" ry="40" fill="#f4deb1" stroke="#b59775" stroke-width="5"/><path d="M187 70h26v182h-26Z" fill="#dabd7e"/><path d="M94 113v140m212-140v140" stroke="#e8c68c" stroke-width="8"/><path d="M42 117 200 29l158 88-15 25q-28 18-51 0-31 23-59 0-31 23-64 0-29 23-58 0-29 18-54 0Z" fill="#e5cba0" stroke="#b29477" stroke-width="4"/><path d="M200 31 111 118l29 27 29-3 31-111 33 111 31 3 28-27Z" fill="#b48e9a"/><path d="M40 118h319" stroke="#f9e0ad" stroke-width="9"/><path d="M200 27V5l30 8-30 10" fill="#b88e9d" stroke="#a1837d" stroke-width="3"/>${[95,151,210,267,318].map((x,i)=>`<g transform="translate(${x-38} ${i%2?158:174}) scale(.76)" opacity="${i<installed?1:.18}">${p.horse}</g>`).join('')}${[68,100,132,165,198,231,264,297,330].map(x=>`<circle cx="${x}" cy="126" r="4" fill="${installed===5?'#ffffd5':'#eedaac'}"/>`).join('')}</svg>`;}
function machine(){return `<div class="machine"><div class="machine-top"><i></i><b>梦 境 藏 品</b></div><div class="glass"><span class="glass-shine"></span>${Array.from({length:10},(_,i)=>`<i class="capsule c${i}" style="--i:${i};--c:${['#dfacbd','#9dc9c1','#eed29b','#b4abd8'][i%4]}"></i>`).join('')}</div><div class="machine-body"><div class="knob"><i></i></div><div class="outlet" id="outlet"></div><small>DREAM KEEPSAKES</small></div><div class="machine-foot"></div></div>`;}
function sceneBackdrop(zone,points,height){let decor='';for(let y=100,i=0;y<height;y+=170,i++){const x=i%2?350:20;const name=zone===4?(i%3?'shell':'boat'):zone===5?(i%3?'moon':'scope'):i%5===0?['house','cake','train','cloud','boat','scope'][zone]:'tree';decor+=`<g transform="translate(${x} ${y}) scale(${i%3===0?.85:.66})" opacity=".82">${p[name]}</g>`;}const d=points.map((pt,i)=>`${i?'L':'M'}${pt.x} ${pt.y+35}`).join(' ');return `<svg class="backdrop" viewBox="0 0 450 ${height}" style="height:${height}px"><defs><pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="12" cy="23" r="1.5" fill="#fff5d7" opacity=".45"/><path d="m35 40 2-5 2 5" fill="none" stroke="#578875" opacity=".18"/></pattern></defs><rect width="450" height="${height}" fill="url(#dots)"/><path d="${d}" fill="none" stroke="#6e8a75" stroke-opacity=".12" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#eee3c1" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fff1d1" stroke-width="49" stroke-opacity=".5" stroke-linecap="round" stroke-linejoin="round"/>${decor}</svg>`;}

const names={energy:'活动体力',coins:'金币',diamonds:'钻石',mainEnergy:'主线体力',speed:'加速卡',generator:'生成器加速',tickets:'扭蛋券'};
const resourceIcon=k=>({mainEnergy:'energy',speed:'gift',generator:'gear',tickets:'ticket'})[k]||k;
const button=(label,action,cls='primary',attrs='')=>`<button class="${cls}" data-action="${action}" ${attrs}>${label}</button>`;
function rewards(r){return `<div class="reward-row">${Object.entries(r).map(([k,v])=>`<div class="reward-item">${icon(resourceIcon(k))}<b>×${v}</b><small>${names[k]||k}</small></div>`).join('')}</div>`;}
function timeText(s){const t=Math.max(0,s.created+CONFIG.days*86400000-nowOf(s));return t?`${Math.floor(t/86400000)}天 ${Math.floor(t/3600000)%24}时`:'已到期 · 离开后结算';}
function regenText(s){if(s.energy>=CONFIG.cap)return '恢复已满';const seconds=Math.ceil((CONFIG.regenMs-(nowOf(s)-s.lastRegen)%CONFIG.regenMs)/1000);return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;}
function goal(s){if(s.horses.some(h=>!s.installed.includes(h)))return {title:'返回广场，安装木马',sub:'可以先领取宝箱，再通过传送门回城',icon:'horse',portal:true};if(s.story.length===17)return {title:'再去收集一些美好回忆',sub:'剧情已完成 · 继续探索与扭蛋收藏',icon:'star'};if(s.map===0&&s.story.includes(1)){const map=Math.min(5,s.installed.length+1);return {title:`前往${ZONES[map].name}`,sub:'新展区已经开放',icon:ZONES[map].icon,portal:true};}const n=currentNode(s);if(!n)return {title:'这条小路已经探索完毕',sub:'返回主路或打开任务手册补收集',icon:'book'};return {title:n.type==='obstacle'?`清开${n.name}`:s.prepared[n.id]?(n.step===1?'收集纪念标记':`领取${ZONES[s.map].horse}`):n.name,sub:n.type==='obstacle'?`打开前方的道路 · ${n.segments.length-(s.stages[n.id]||0)}段待清除`:'点击场景目标完成互动',icon:n.icon,node:n};}
function welcome(s){if(s.ended)return `<div class="welcome"><span class="eyebrow">UNTIL WE MEET AGAIN</span><h1>梦境暂时落幕</h1>${carousel(5)}<p>这一次的美好，已经被珍藏。<br>主线奖励已保留在你的账户中。</p>${button('查看本期结算','settlement')}${button('评审工具','review','text-link')}</div>`;if(!s.inside)return `<div class="welcome"><span class="eyebrow">MERGE COOKING</span><h1>小憩片刻</h1>${icon('house','home-art')}<p>活动进度已经保存。<br>完成主线订单，为下一次冒险补充体力。</p>${button('返回梦境博览会','enter')}<div class="button-row">${button('查看主线奖励','wallet','secondary')}${button('评审：模拟订单','order','secondary')}</div><span class="muted">此处为主游戏接口示意，未接入真实主棋盘。</span></div>`;return `<div class="welcome"><span class="eyebrow">YOU ARE CORDIALLY INVITED</span><h1>梦境博览会</h1><h2>Dream Expo</h2>${carousel(5)}<p>“你为自己留的位置，<br>一直没有人坐。”</p>${button('拆开邀请，进入梦境','start')}<span class="muted">13 天奇妙旅程 · 找回五匹木马<br>点击清障，收集回忆，重启旋转木马</span></div>`;}
function portals(s){return `<div class="portal-grid">${ZONES.slice(1).map((z,i)=>{const m=i+1,open=unlocked(s,m);return button(`${icon(z.icon)}${z.name}<small>${s.installed.includes(m)?'已安装 · 可回访':s.horses.includes(m)?'木马待安装':open?'进入探索':'尚未开放'}</small>`,'map',`zone-door ${open?'active-door':'locked-door'}`,`data-map="${m}"`);}).join('')}</div>`;}
function gameView(s,ui,width){const scale=width/450,m=MAPS[s.map],z=ZONES[s.map],list=s.branch===null?m.nodes:m.branches[s.branch],cur=currentNode(s);let height=s.branch===null?m.height:Math.max(900,list.at(-1).y+270);const plazaTop=1120;if(s.map===0&&s.story.includes(1))height=1930;
 let fogY=cur?cur.y+220:height;const nodes=list.filter(n=>n.type==='chest'?s.story.includes(n.p):n.y<fogY+50).map(n=>{const isDone=done(s,n.id),can=accessible(s,n),selected=ui.selected===n.id,stage=s.stages[n.id]||0;const label=n.type==='chest'?`${n.kind==='energy'?'体力':'金币'} +${n.amount}`:isDone?'已完成':s.prepared[n.id]?(n.step===1?'收集纪念标记':`领取${z.horse}`):n.name;return `<button data-action="node" data-id="${n.id}" class="map-node ${n.type} ${isDone?'completed':''} ${!can?'locked':''} ${cur?.id===n.id?'current':''} ${selected?'selected':''}" style="left:${n.x}px;top:${n.y}px" aria-label="${label}" ${!can||isDone?'disabled':''}>${icon(s.prepared[n.id]&&!isDone&&n.step===1?'star':n.icon)}${n.type!=='obstacle'||selected?`<span class="node-tag">${label}</span>`:''}${(selected||cur?.id===n.id)&&n.type==='obstacle'?`<span class="cost-bubble">${icon('energy')}<b>${n.segments[stage]}</b>${n.segments.length>1?`<small>余${n.segments.length-stage}段</small>`:''}</span>`:''}</button>`;}).join('');
 const g=goal(s);let branchUI='';if(s.map>0&&s.branch===null){for(let b=0;b<2;b++){const n=m.nodes.find(n=>n.type==='story'&&n.step===b);if(done(s,n.id))branchUI+=`<div class="branch-links" style="top:${n.y+98}px">${button(`小径 ${b+1} · 童年纪念 ↗`,'branch','branch-link',`data-branch="${b}"`)}</div>`;}}

function dragMap(vp){let start=null,moved=false;vp.onpointerdown=e=>{if(e.pointerType!=='mouse')return;start={y:e.clientY,scroll:vp.scrollTop};moved=false;};vp.onpointermove=e=>{if(!start||e.buttons!==1)return;if(Math.abs(e.clientY-start.y)>7)moved=true;if(moved){vp.scrollTop=start.scroll-(e.clientY-start.y);}};vp.onpointerup=()=>{start=null;if(moved){vp.dataset.dragged='1';setTimeout(()=>delete vp.dataset.dragged,80);}};vp.onpointerleave=()=>{start=null;};}
function center(el){const b=el?.getBoundingClientRect();return b?{x:b.x+b.width/2,y:b.y+b.height/2}:null;}
function fly(name,from,to,delay=0){if(!from||!to||reduced())return Promise.resolve();const f=document.createElement('div');f.className='fly';f.innerHTML=icon(name);f.style.left=`${from.x-19}px`;f.style.top=`${from.y-19}px`;document.querySelector('#fx').append(f);const a=f.animate([{transform:'translate(0,0) scale(.6)',opacity:1},{transform:`translate(${(to.x-from.x)*.45}px,${(to.y-from.y)*.45-55}px) scale(1.15)`,opacity:1},{transform:`translate(${to.x-from.x}px,${to.y-from.y}px) scale(.8)`,opacity:1}],{duration:650,delay,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'});return a.finished.catch(()=>{}).then(()=>f.remove());}
function burst(point){if(!point||reduced())return;for(let i=0;i<22;i++){const f=document.createElement('i');f.className='confetti';f.style.cssText=`left:${point.x}px;top:${point.y}px;--dx:${(Math.random()-.5)*260}px;--dy:${Math.random()*160-160}px;--color:${['#ead29b','#a5c6ad','#d3a2b6','#eee8ce'][i%4]}`;document.querySelector('#fx').append(f);setTimeout(()=>f.remove(),1400);}}
function costFx(point,cost){if(!point||reduced())return;const f=document.createElement('span');f.className='float-cost';f.style.left=`${point.x}px`;f.style.top=`${point.y-25}px`;f.textContent=`−${cost}`;document.querySelector('#fx').append(f);setTimeout(()=>f.remove(),900);}
function execute(action,data={}){const snapshot=structuredClone(state);let r;try{r=act(state,action,data);if(r.ok){saveState(state);sound(r.reward?'reward':'tap');}return r;}catch(e){state=snapshot;return {ok:false,message:'保存失败，未提交本次操作。请导出已有存档。'};}}
function handleResult(r){if(!r.ok){if(r.needEnergy){ui.cost=r.cost;open('energy');}toast(r.message);return false;}if(r.reward){ui.reward=r.reward;open('reward');}if(r.message)toast(r.message);return true;}
async function transitionMap(map){if(ui.busy)return;ui.busy=true;const veil=document.createElement('div');veil.className='loading';veil.innerHTML=`<div class="spinner"></div><span>前往${ZONES[map].name}</span>`;app.append(veil);await new Promise(r=>setTimeout(r,reduced()?0:420));const r=execute('map',{map});ui.busy=false;if(!r.ok){veil.remove();toast(r.message);return;}ui.modal=null;ui.selected=null;scroll=0;render({focus:true});}
async function draw(free){const r=execute('draw',{count:ui.multiplier,free});if(!r.ok){toast(r.message);return;}ui.busy=true;render();const source=center(document.querySelector('#outlet'));await new Promise(r=>setTimeout(r,reduced()?0:700));ui.busy=false;ui.modal='results';render();const cards=[...document.querySelectorAll('[data-result]')];cards.forEach(c=>c.style.visibility=reduced()?'visible':'hidden');await Promise.all(r.results.map((item,i)=>fly(item.type==='toy'?TOYS[item.id].icon:resourceIcon(item.type),source,center(cards[i]),i*75).then(()=>{if(cards[i])cards[i].style.visibility='visible';})));sound('reward');}
function sourceInfo(task,id){if(task==='mementos'){const n=NODE_BY_ID[id];return {title:n.name,icon:n.icon,map:n.map,branch:n.branch,id:n.id,text:`在${ZONES[n.map].name}的回忆小径 ${n.branch+1}，清开道路后免费拾取。`};}const map=Number(id),z=ZONES[map],step=task==='horses'?2:1;return {title:task==='horses'?z.horse:`${z.repair}纪念标记`,icon:task==='horses'?'horse':z.icon,map,branch:null,id:MAPS[map].nodes.find(n=>n.type==='story'&&n.step===step).id,text:task==='horses'?`在${z.name}完成最终剧情后领取。获得后保留在手册，自行回广场安装。`:`在${z.name}修复${z.repair}后，再次点击纪念标记收集。`};}
function fastForward(){if(!state.inside||state.ended||state.dialog||state.pendingBatch)return toast('请先回到地图，完成当前剧情或扭蛋结果');let n=currentNode(state),count=0;if(!n)return toast('此处已没有待推进的主路目标');while(n&&n.type!=='story'&&count<150){if(n.type==='obstacle'&&state.energy<n.segments[state.stages[n.id]||0]){state.energy+=1000;state.events.push({type:'debug_supply',amount:1000,at:Date.now()});}const r=act(state,'node',{id:n.id});if(!r.ok)return toast(r.message);n=currentNode(state);count++;}persist();ui.modal=null;ui.selected=null;render({focus:true});toast(`评审推进了 ${count} 次操作；剧情仍需手动完成`);}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||document.querySelector('#viewport')?.dataset.dragged)return;const a=b.dataset.action;if(ui.busy)return;if(state.dialog&&!['dialog','skipDialog'].includes(a))return;
 if(a==='start'){execute('start');ui.modal=null;render({focus:true});return;}
 if(a==='node'){const n=NODE_BY_ID[b.dataset.id];if(n.type==='obstacle'&&ui.selected!==n.id){ui.selected=n.id;render();return;}const pt=center(b),beforeStory=state.story.length;const r=execute('node',{id:n.id});if(!r.ok){handleResult(r);return;}ui.selected=r.cleared?null:n.id;render();if(r.cost)costFx(pt,r.cost);if(r.cleared){ui.busy=true;await new Promise(res=>setTimeout(res,reduced()?0:260));ui.busy=false;focusTarget();}if(r.reward)fly(resourceIcon(Object.keys(r.reward)[0]),pt,center(document.querySelector('.energy-pill')));if(r.drop)fly('ticket',pt,center(document.querySelector('[data-action="gacha"]')));if(r.horse){fly('horse',pt,center(document.querySelector('[data-action="notebook"]')));burst(pt);}if(state.story.length>beforeStory){toast(`剧情进度 +1 · ${state.story.length}/17，附近宝箱已解锁`);burst(pt);}else if(r.message)toast(r.message);else if(r.reward)toast(Object.entries(r.reward).map(([k,v])=>`${k==='energy'?'活动体力':'金币'} +${v}`).join(' '));return;}
 if(a==='dialog'||a==='skipDialog'){const old=state.story.length;const r=execute('dialog',{skip:a==='skipDialog'});render();if(!r.ok)return toast(r.message);if(r.finale){ui.modal='finale';render();burst(center(app));}else if(state.story.length>old){toast(`剧情进度 +1 · ${state.story.length}/17，宝箱已经出现`);}return;}
 if(a==='close'){if(state.pendingBatch)return;ui.modal=null;render();return;}
 if(a==='map'){await transitionMap(Number(b.dataset.map));return;}
 if(a==='portal'){if(state.branch!==null){handleResult(execute('branch',{branch:null}));scroll=0;ui.selected=null;render({focus:true});}else if(state.map)await transitionMap(0);else open('maps');return;}
 if(a==='branch'){const r=execute('branch',{branch:Number(b.dataset.branch)});if(handleResult(r)){scroll=0;ui.selected=null;render({focus:true});}return;}
 if(a==='locate'){const g=goal(state);if(g.portal){open('maps');}else{ui.modal=null;render();focusTarget();}return;}
 if(a==='source'){ui.source=sourceInfo(b.dataset.task,b.dataset.id);open('source');return;}
 if(a==='locateSource'){const d=ui.source;if(d.map!==state.map){toast(`目标位于${ZONES[d.map].name}，请通过传送门自行前往`);open('maps');return;}if(d.branch!==state.branch){const r=execute('branch',{branch:d.branch});if(!r.ok){toast(r.message);return;}}ui.modal=null;render();focusTarget(true);return;}
 if(a==='toy'){ui.toy=Number(b.dataset.id);execute('viewToy',{id:ui.toy});open('toy');return;}
 if(a==='multiplier'){ui.multiplier=Number(b.dataset.count);render();return;}
 if(a==='draw'||a==='free'){await draw(a==='free');return;}
 if(a==='ackBatch'){const r=execute('ackBatch');if(!r.ok)return toast(r.message);open('gacha');return;}
 if(a==='claim'){handleResult(execute('claim',{id:b.dataset.id}));return;}
 if(a==='preview'){ui.rewardId=b.dataset.id;open('preview');return;}
 if(a==='prize'){ui.rewardId='story';open('prize');return;}
 if(a==='exchange'){handleResult(execute('exchange'));return;}
 if(a==='leave'){const r=execute('leave');if(!r.ok)return toast(r.message);ui.modal=state.ended?'settlement':null;render();return;}
 if(a==='enter'){const r=execute('enter');if(!r.ok)return toast(r.message);ui.modal=null;render({focus:true});return;}
 if(a==='sound'||a==='reduced'){state.settings[a]=!state.settings[a];persist();render();sound();return;}
 if(a==='network'){state.online=!state.online;persist();render();return;}
 if(a==='order'){const val=document.querySelector('#order-amount')?.value??state.review.orderEnergy;const amount=Number(val);const r=receiveOrder(state,`review-${Date.now()}-${state.orders.length}`,amount);if(r.ok){persist();render();toast(`模拟订单已完成 · 活动体力 +${amount}`);}else toast(r.message);return;}
 if(a==='saveConfig'){const amount=Number(document.querySelector('#order-amount').value),raw=document.querySelector('#conversion').value,rate=raw===''?null:Number(raw);if(!Number.isSafeInteger(amount)||amount<0||amount>100000||rate!==null&&(!Number.isFinite(rate)||rate<0||rate>10000))return toast('请输入有效的非负体验数值');state.review={orderEnergy:amount,energyConversion:rate};persist();toast('体验配置已保存');return;}
 if(a==='advanceTime'){state.clockOffset+=6*3600000;tick(state);persist();render();toast('评审时间推进 6 小时，恢复按上限计算');return;}
 if(a==='expire'){state.clockOffset=14*86400000;tick(state);persist();render();toast('已到期：停留活动可续玩，离开后结算');return;}
 if(a==='zeroEnergy'){state.energy=0;state.lastRegen=Date.now()+state.clockOffset;persist();render();return;}
 if(a==='addTickets'){state.tickets+=100;state.events.push({type:'debug_tickets',amount:100,at:Date.now()});persist();render();return;}
 if(a==='fastForward'){fastForward();return;}
 if(a==='reset'){state=initialState();ui.modal=null;ui.selected=null;ui.multiplier=1;scroll=0;persist();render();return;}
 if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='梦境博览会-体验存档.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}
 open(a);
});
document.querySelector('#review-entry').addEventListener('click',()=>{if(ui.busy||state.dialog||state.pendingBatch)return toast('请先完成当前演出');open('review');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal&&!state.pendingBatch&&!ui.busy){ui.modal=null;render();}});
new ResizeObserver(()=>render()).observe(app);
window.addEventListener('pagehide',persist);
setInterval(()=>{const before=state.energy;tick(state);if(before!==state.energy)persist();const en=document.querySelector('#energy-value'),rg=document.querySelector('#regen'),cl=document.querySelector('#clock');if(en)en.textContent=`${state.energy}/150`;if(rg)rg.textContent=regenText(state);if(cl)cl.textContent=`◷ ${timeText(state)}`;},1000);
render({focus:true});persist();

})();</script></body></html>
